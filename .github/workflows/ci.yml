name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore gpu-image-processing.sln

      - run: dotnet build gpu-image-processing.sln --no-restore --configuration Release

      - run: dotnet test gpu-image-processing.sln --no-build --configuration Release --verbosity normal
